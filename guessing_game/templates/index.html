<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guessing Game (Flask)</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="container">
      <h1>Number Guessing Game</h1>
      <p class="subtle">I'm thinking of a number between 1 and 100.</p>

      {% if feedback %}
        <div class="feedback">{{ feedback }}</div>
      {% endif %}

      <form action="{{ url_for('guess') }}" method="POST" class="card">
        <label for="guess">Your guess</label>
        <input id="guess" name="guess" type="number" min="1" max="100" required
               placeholder="Enter a number…" {% if game_end %}disabled{% endif %} />
        <input type="hidden" name="prev_guess" value="{{ prev_guess or '' }}"/>
        <button type="submit" id="submit" {% if game_end %}disabled{% endif %}>Submit</button>
      </form>

      <div class="meta">
        <span>Guesses so far: {{ guesses or 0 }}</span>
        {% if prev_guess is not none %}
          <span>Last guess: {{ prev_guess }}</span>
        {% endif %}
      </div>

      <form action="{{ url_for('reset') }}" method="POST">
        <button type="submit" class="secondary">Start a New Game</button>
      </form>
    </main>
  </body>
</html>
